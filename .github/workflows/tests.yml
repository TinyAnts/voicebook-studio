name: Test Voicebook Studio
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ui.txt
      - name: Install document processing and test dependencies (no model weights)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -U pip
          python -m pip install -r requirements-ui.txt numpy
      - name: Syntax check
        run: python -m compileall -q app.py core.py worker.py jobs.py dashboard.py export_audio.py library_store.py naming.py theme.py hf_space/app.py
      - name: Unit tests including embedded cover artwork and chapter encoding
        run: python -m unittest discover -s tests -v
